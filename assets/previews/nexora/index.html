<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA — Skill-to-Opportunity Network</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="nx">
  <header class="nx-top">
    <span class="nx-logo">N</span>
    <span class="nx-name">NEXORA</span>
    <span class="nx-live">LIVE DEMO</span>
  </header>
  <div class="nx-stats">
    <div><strong data-count="128">0</strong><small>skills tracked</small></div>
    <div><strong data-count="46">0</strong><small>builds shipped</small></div>
    <div><strong data-count="19">0</strong><small>matches</small></div>
  </div>
  <ol class="nx-pipe">
    <li><span>Learn</span><div class="bar"><i data-w="86"></i></div><b>86%</b></li>
    <li><span>Build</span><div class="bar"><i data-w="64"></i></div><b>64%</b></li>
    <li><span>Prove</span><div class="bar"><i data-w="52"></i></div><b>52%</b></li>
    <li><span>Connect</span><div class="bar"><i data-w="38"></i></div><b>38%</b></li>
    <li><span>Discover</span><div class="bar"><i data-w="24"></i></div><b>24%</b></li>
  </ol>
  <button id="week" type="button">Simulate a week →</button>
</div>
<script src="app.js"></script>
</body>
</html>

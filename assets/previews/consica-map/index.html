<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CONSICA MAP — Virtual Driving World</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="mp">
  <header class="mp-top">
    <span class="mp-logo">M</span>
    <span class="mp-name">CONSICA MAP</span>
    <span class="mp-live">LIVE MAP</span>
  </header>
  <div class="mp-hud">
    <div><small>SPEED</small><strong><span id="speed">42</span> km/h</strong></div>
    <div><small>POSITION</small><strong id="pos">—</strong></div>
    <div><small>LAP</small><strong><span id="lap">1</span> / 5</strong></div>
  </div>
  <div id="map"></div>
  <div class="mp-foot">
    <button id="faster" type="button">Faster +</button>
    <button id="slower" type="button">Slower −</button>
    <button id="reset" type="button">Reset lap</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
